        .nav-btn.disabled { opacity: 0.35; pointer-events: none; }

<script>
    document.getElementById('drugSheet').innerHTML = CPGGuide.renderDrug(window.CPG_DRUG);
</script>
<script>
(function() {
    // Theme
    const themes = ['dark','light','sepia','forest'];
    const html = document.documentElement;
    function initTheme() {
        html.setAttribute('data-theme', localStorage.getItem('theme') || 'dark');
    }
    function nextTheme() {
        const cur = html.getAttribute('data-theme') || 'dark';
        const next = themes[(themes.indexOf(cur)+1) % themes.length];
        html.setAttribute('data-theme', next);
        localStorage.setItem('theme', next);
    }
    document.getElementById('themeToggle').addEventListener('click', nextTheme);
    document.getElementById('backBtn').addEventListener('click', () => {
        if (document.referrer) history.back();
        else window.location.href = 'm1-38.html';
    });
    initTheme();
})();
</script>
<script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('../sw.js').catch(()=>{});
        });
    }
</script>
</body>
</html>
